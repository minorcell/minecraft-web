name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时触发
  push:
    branches: [ "main" ]
  # 允许手动触发
  workflow_dispatch:

# 允许此 Job 读取仓库内容
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 步骤1: 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 步骤2: 设置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 步骤3: 将静态文件部署到 GitHub Pages
      # 由于这是纯静态项目（无构建步骤），直接上传
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 步骤4: 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
